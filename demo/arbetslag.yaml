providers:
  - openai

templates:
  - name: default
    description: General-purpose assistant
    ai_provider: openai
    model: tensorzero::model_name::gemma_4_E4B
    systemPrompt: >
      You are a helpful assistant. Answer the user's questions concisely and accurately.
    allowedTools:
      - get_time
      - http_request
      - send_telegram_message
